# NOTE: the FILENAME of this workflow is part of PyPI trusted publishing -- keep it.
name: Release interop-python

# packages/interop-python is a PyPI package (`johnhenry-math-plus-interop`)
# outside the npm/Cargo workspaces (docs/RELEASING.md), released separately
# from the Changesets-driven npm/JSR releases in release.yml.
#
# Publish model: main is the release branch (johnhenry/workflows#10). A push to
# main publishes only if packages/interop-python/pyproject.toml's version isn't
# on PyPI yet (otherwise a clean no-op), then tags
# johnhenry-math-plus-interop-v<version> and creates a GitHub Release. To
# release: bump [project].version in a PR and merge it.
#
# Uses PyPI's OIDC "Trusted Publishing" -- no token/secret to store, but it
# needs a one-time manual step on pypi.org before this does anything: see
# docs/RELEASING.md's "PyPI (interop-python)" section.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # tag + GitHub Release by-product of pypi-publish.yml
      id-token: write # PyPI OIDC trusted publishing
    uses: johnhenry/workflows/.github/workflows/pypi-publish.yml@v1
    with:
      package-name: johnhenry-math-plus-interop
      working-directory: packages/interop-python
      # Runs only when the version is new on PyPI, before the build.
      gate-commands: |
        pip install pytest pyarrow pandas numpy -e .
        python3 -m pytest tests/ -v
