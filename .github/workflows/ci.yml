name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede an in-flight run when new commits land on the same ref -- the
# whole family shares this block so a rapid push sequence never queues N
# redundant runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node >=24.0.0 -- test the floor version directly rather
        # than a matrix of older majors. Nothing in the repo needs 26
        # (checked: no Node-26-only API; Float16Array, Math.f16round and
        # type stripping for `node --test` on .ts all work on 24.9).
        node-version: [24]
        # `bun` runs every suite under `bun test` via scripts/test-bun.mjs
        # (test/harness.ts explains the Bun 1.2 node:test multi-file bug the
        # per-file harness import works around). Node is still needed there
        # for npm ci / tsc / the WASM build.
        runtime: [node, bun]
    name: ${{ matrix.runtime }} (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Rust -> WASM kernels. lld is required to link wasm32-unknown-unknown;
      # the flat extern-C ABI needs no wasm-bindgen/wasm-pack toolchain.
      - name: Set up Rust wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update && sudo apt-get install -y lld

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # NumPy oracle for tensor-core's differential tests, and pyarrow/pandas
      # for frame-arrow/frame-parquet's pyarrow-round-trip tests (MATH_PLUS_ORACLE_PYTHON,
      # docs/TESTING.md) — every one of these tests SKIPs rather than fails
      # when its oracle is unavailable, so the import check below is the
      # guard that keeps CI honest about actually running them, not
      # silently skipping and reporting green.
      - name: Set up Python (NumPy/pyarrow/pandas oracles)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ml_dtypes: bfloat16 for NumPy -- tensor-core's bf16 .npy and
      # withCompute oracle tests (test/half-compute.test.ts). safetensors:
      # the reference reader/writer @johnhenry/math-plus-safetensors' oracle
      # tests compare against (they skipped in CI without it).
      # scipy: @johnhenry/math-plus-signal's scipy.signal oracle and
      # tensor-core's scipy.special erf/GELU oracle (26 tests skipped in CI
      # without it). torch (CPU-only wheel, the small one): the PyTorch
      # parity oracles in tensor-autograd and safetensors (55 skipped).
      - run: |
          pip install numpy pyarrow pandas ml_dtypes safetensors scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify the oracles are importable (differential/round-trip tests must not skip)
        run: python3 -c "import numpy, pyarrow, pandas, ml_dtypes, safetensors.numpy, scipy.signal, scipy.special, torch; print('numpy', numpy.__version__, 'pyarrow', pyarrow.__version__, 'pandas', pandas.__version__, 'ml_dtypes', ml_dtypes.__version__, 'safetensors', safetensors.__version__, 'scipy', scipy.__version__, 'torch', torch.__version__)"

      # Real WebGPU for @johnhenry/math-plus-tensor-webgpu's GPU-correctness
      # tests: Dawn in-process (the `webgpu` npm package, test/helpers.ts's
      # `dawn` harness) over Mesa's lavapipe software Vulkan. The runner has
      # no GPU; with lavapipe installed, Dawn's plain requestAdapter()
      # returns the llvmpipe CPU adapter and every WebGPU test runs (no
      # subgroup matrices there, so the one Apple-only kernel test skips).
      # This replaced the headless-Chrome + Xvfb + SwiftShader setup, which
      # never worked on these runners: Chrome never exposed its CDP endpoint,
      # so all 33 WebGPU tests skipped. MATH_PLUS_WEBGPU_HARNESS=dawn (set on
      # the test steps) keeps the harness from spending three Chrome launch
      # timeouts looking for a browser that isn't installed.
      - name: Install software Vulkan (lavapipe) for Dawn
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools && (vulkaninfo --summary || true)

      # Both legs: the node leg's write-buffer test spawns `bun` for its
      # Bun-only repro (it skipped here with "no `bun` on PATH").
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the harness was verified against (1.2.17
          # has the multi-file node:test bug the harness works around).
          bun-version: 1.2.17

      - run: npm ci

      - name: Build (WASM kernels + TypeScript)
        run: npm run build

      - name: Rust unit tests
        if: matrix.runtime == 'node'
        run: cargo test --workspace

      - name: Unit + differential tests
        if: matrix.runtime == 'node'
        env:
          MATH_PLUS_WEBGPU_HARNESS: dawn
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          echo "### Skipped tests (node)" >> "$GITHUB_STEP_SUMMARY"
          echo "total: $(grep -c '^﹣' test.log || true)" >> "$GITHUB_STEP_SUMMARY"
          grep '^﹣' test.log | sed -E 's/.*# //' | sort | uniq -c | sort -rn | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      # Fails on any failing test AND on any suite where Bun ran fewer files
      # than exist (the multi-file bug's signature). Runtime `t.skip()`s are
      # reported as `[skip]` lines + counted in the summary, since bun:test
      # 1.2 cannot mark a running test skipped.
      - name: Unit + differential tests (Bun)
        if: matrix.runtime == 'bun'
        env:
          MATH_PLUS_WEBGPU_HARNESS: dawn
        run: |
          npm run typecheck --workspaces --if-present
          npm run test:bun

      # Runs the env-independent examples (01-09) against the built
      # packages via their real exports maps. 10-wasm-kernels.mjs is
      # deliberately excluded from the loop (env-dependent: needs the
      # gitignored .wasm artifact) — see examples/README.md.
      - name: Run examples (smoke)
        if: matrix.runtime == 'node'
        run: npm run examples

      # packages/interop-python is a PyPI package outside the npm/Cargo
      # workspaces (docs/RELEASING.md) — its own pytest suite needs
      # installing separately.
      - name: Install johnhenry-math-plus-interop + test deps
        if: matrix.runtime == 'node'
        run: pip install pytest -e packages/interop-python

      - name: interop-python conformance tests
        if: matrix.runtime == 'node'
        run: python3 -m pytest packages/interop-python/tests/ -v

  # tensor-mlx's MLX suites (conformance + NumPy differential + bridge) on
  # real Apple Silicon Metal (#145, decided in RFC 0001 §12 Q5), under Node,
  # Bun and Deno. The Linux legs above skip every MLX test (skip-don't-fail
  # off darwin/arm64), so this is the only CI coverage of the native path.
  # Non-blocking to start (make it required once it has been stable); it
  # still goes red, rather than passing silently, if any MLX test skips.
  #
  # MLX comes from the published platform package that `npm ci` installs
  # (@johnhenry/backend-mlx-darwin-arm64@0.1.1, an optional dependency of
  # @johnhenry/backend-mlx 0.3). 0.1.1 carries a metallib that loads on
  # macOS 15 (verified by laya-js CI); 0.1.0's did not ("could not create gpu
  # stream: vector"), which is why this job used to build mlx-c itself.
  # LAYA_MLXC_PATH must stay unset so the tests exercise that package.
  mlx-macos:
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    name: mlx (macos-15 arm64, Metal)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy: the differential suite's oracle (packages/tensor-mlx/scripts/numpy_oracle.py).
      - run: pip install numpy

      - run: npm ci

      # Only the two packages the MLX suites import: no Rust/WASM toolchain on
      # this leg (the Linux legs build and test everything).
      - name: Build (special + tensor-core + tensor-mlx)
        # tensor-core depends on math-plus-special (the canonical erf), so build it first.
        run: npm run build -w @johnhenry/math-plus-special -w @johnhenry/math-plus-tensor-core -w @johnhenry/math-plus-tensor-mlx

      - name: Report the runner and the MLX bundle the tests load
        run: |
          uname -m; sw_vers
          test -z "${LAYA_MLXC_PATH:-}" || { echo "::error::LAYA_MLXC_PATH is set; this job must test the platform package"; exit 1; }
          node -p "const v = (p) => JSON.parse(require('fs').readFileSync('node_modules/' + p + '/package.json', 'utf8')).version; 'backend-mlx ' + v('@johnhenry/backend-mlx') + ', platform package ' + v('@johnhenry/backend-mlx-darwin-arm64')"
          ls -la node_modules/@johnhenry/backend-mlx-darwin-arm64/lib
          node --input-type=module -e "import { createMlxBackend } from '@johnhenry/backend-mlx'; const b = createMlxBackend(); console.log(b.info, b.device)"

      - name: tensor-mlx tests (Node, Bun, Deno) on Metal -- must not skip
        run: |
          rc=0
          npm test -w @johnhenry/math-plus-tensor-mlx > mlx-node.log 2>&1 || rc=1
          npm run test:bun -w @johnhenry/math-plus-tensor-mlx > mlx-bun.log 2>&1 || rc=1
          NO_COLOR=1 npm run test:deno -w @johnhenry/math-plus-tensor-mlx > mlx-deno.log 2>&1 || rc=1
          cat mlx-node.log mlx-bun.log mlx-deno.log
          node_pass=$(grep -E "^ℹ pass " mlx-node.log | awk '{print $3}')
          node_skip=$(grep -E "^ℹ skipped " mlx-node.log | awk '{print $3}')
          bun_pass=$(grep -E "^ *[0-9]+ pass" mlx-bun.log | awk '{print $1}')
          bun_skip=$(grep -E "^ *[0-9]+ skip" mlx-bun.log | awk '{print $1}')
          bun_rt_skip=$(grep -c "\[skip\]" mlx-bun.log || true)
          deno_pass=$(grep -oE "[0-9]+ passed" mlx-deno.log | tail -1 | awk '{print $1}')
          deno_skip=$(grep -oE "[0-9]+ ignored" mlx-deno.log | tail -1 | awk '{print $1}')
          {
            echo "### tensor-mlx on macos-15 (Metal)"
            echo "| runtime | pass | skipped |"
            echo "|---|---|---|"
            echo "| node | ${node_pass:-?} | ${node_skip:-?} |"
            echo "| bun | ${bun_pass:-?} | ${bun_skip:-0} (+${bun_rt_skip} runtime [skip]) |"
            echo "| deno | ${deno_pass:-?} | ${deno_skip:-0} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${node_skip:-1}" != "0" ] || [ -n "$bun_skip" -a "${bun_skip:-0}" != "0" ] || [ "$bun_rt_skip" != "0" ] || [ "${deno_skip:-0}" != "0" ] || [ -z "$deno_pass" ]; then
            echo "::error::MLX suites skipped on the macOS runner (the Metal path was not exercised)"; exit 1
          fi
          exit $rc
