name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede an in-flight run when new commits land on the same ref -- the
# whole family shares this block so a rapid push sequence never queues N
# redundant runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Rust -> WASM kernels. lld is required to link wasm32-unknown-unknown;
      # the flat extern-C ABI needs no wasm-bindgen/wasm-pack toolchain.
      - name: Set up Rust wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update && sudo apt-get install -y lld

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # NumPy oracle for tensor-core's differential tests, and pyarrow/pandas
      # for frame-arrow/frame-parquet's pyarrow-round-trip tests (MATH_PLUS_ORACLE_PYTHON,
      # docs/TESTING.md) — every one of these tests SKIPs rather than fails
      # when its oracle is unavailable, so the import check below is the
      # guard that keeps CI honest about actually running them, not
      # silently skipping and reporting green.
      - name: Set up Python (NumPy/pyarrow/pandas oracles)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pyarrow pandas

      - name: Verify the oracles are importable (differential/round-trip tests must not skip)
        run: python3 -c "import numpy, pyarrow, pandas; print('numpy', numpy.__version__, 'pyarrow', pyarrow.__version__, 'pandas', pandas.__version__)"

      # Headless-WebGPU oracle for @johnhenry/math-plus-tensor-webgpu's GPU-correctness
      # tests (docs/TESTING.md "Headless WebGPU oracle"). Chrome-for-Testing
      # (not the runner image's preinstalled browser) for a pinned, reliable
      # version; Xvfb because headless WebGPU needs a real (virtual) display,
      # not `--headless=new` alone — same reasoning as ~/.local/bin/gl-report
      # on the trycooy dev machine. `--enable-unsafe-swiftshader` (in
      # test/helpers.ts's Chrome flags) is meant to unblock Dawn's software
      # adapter on a GPU-less runner like this one, verified locally by
      # forcing the same flag combination on a machine WITH a real GPU
      # (docs/spikes/webgpu-baseline.md) — not yet confirmed on an actual
      # GitHub Actions runner. If these tests skip here instead of running,
      # check the first CI run's log for the actual `requestAdapter()`
      # failure reason before assuming the package itself is broken.
      - name: Set up Chrome for headless WebGPU tests (@johnhenry/math-plus-tensor-webgpu)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - run: npm ci

      - name: Build (WASM kernels + TypeScript)
        run: npm run build

      - name: Rust unit tests
        run: cargo test --workspace

      - name: Unit + differential tests
        run: npm test

      # Runs the env-independent examples (01-09) against the built
      # packages via their real exports maps. 10-wasm-kernels.mjs is
      # deliberately excluded from the loop (env-dependent: needs the
      # gitignored .wasm artifact) — see examples/README.md.
      - name: Run examples (smoke)
        run: npm run examples

      # packages/interop-python is a PyPI package outside the npm/Cargo
      # workspaces (docs/RELEASING.md) — its own pytest suite needs
      # installing separately.
      - name: Install johnhenry-math-plus-interop + test deps
        run: pip install pytest -e packages/interop-python

      - name: interop-python conformance tests
        run: python3 -m pytest packages/interop-python/tests/ -v
