name: Release

# Multi-package sibling of johnhenry/math's single-package publish.yml.
# Same deployment substrate (GitHub Actions + the NPM_TOKEN secret), but
# driven by Changesets because this repo publishes ~11 independently
# versioned packages instead of one:
#
#   1. Land PRs that include a changeset (`npm run changeset`).
#   2. This workflow opens/updates a "Version Packages" PR that applies the
#      version bumps and changelogs.
#   3. Merging that PR triggers this workflow again, which builds (WASM +
#      TypeScript) and publishes every package whose version is new.
#
# Manual dispatch republishes anything missing from the registry without
# needing a new changeset.
#
# FIRST RUN: with no changesets pending, this publishes every non-private
# package at its CURRENT version (0.0.1 today). See docs/RELEASING.md before
# adding the NPM_TOKEN secret — that secret is what arms this workflow.
#
# Also dual-publishes to JSR (issue #25: npm is the baseline, JSR adds
# first-class Deno reach) via the `jsr-release` job below. JSR publishing
# uses GitHub's OIDC "Trusted Publishing" — no secret to configure here, but
# it DOES require a one-time manual step on jsr.io (claim the @johnhenry
# scope, link this repo as a trusted publisher for each package) before
# it'll do anything; see docs/RELEASING.md's JSR section. Until that's done,
# `jsr-release` fails harmlessly (continue-on-error) and npm publishing is
# completely unaffected — the two are independent jobs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # version-bump commits and tags
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance attestation + JSR OIDC trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Secrets can't be referenced in `if:` directly, so surface it as env and
    # gate the publish step on it — the workflow stays green (and inert) until
    # the token is configured, rather than failing every push with ENEEDAUTH.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs history to diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Set up Rust wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update && sudo apt-get install -y lld

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run build
          npm test

      - name: No NPM_TOKEN — skipping release
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice title=Release skipped::NPM_TOKEN is not configured, so nothing was versioned or published. See docs/RELEASING.md — adding the secret arms this workflow."

      - name: Create version PR or publish
        if: env.NPM_TOKEN != ''
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  jsr-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for JSR's OIDC Trusted Publishing — no token/secret needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update && sudo apt-get install -y lld

      - run: npm ci

      - name: Build (needed so package.json versions reflect the just-published npm state)
        run: npm run build

      # jsr.json's version is generated FROM package.json (scripts/sync-jsr-configs.mjs),
      # never hand-edited — this keeps the two registries' versions from drifting apart.
      - name: Sync jsr.json versions from package.json
        run: node scripts/sync-jsr-configs.mjs

      # Each package publishes independently; `npx jsr publish` no-ops (nonzero exit)
      # if that exact version is already on JSR, which is expected on every run where
      # only SOME packages bumped — continue-on-error keeps one already-published
      # package from blocking the rest. This whole job is a no-op until the @johnhenry
      # scope on jsr.io has this repo configured as a trusted publisher for each
      # package name (one-time manual setup, see docs/RELEASING.md).
      - name: Publish every package to JSR
        continue-on-error: true
        run: |
          # Derived from the committed jsr.json files (which sync-jsr-configs.mjs
          # generates from PACKAGE_DIRS) rather than a second hand-maintained
          # list here -- the hardcoded version of this loop silently rotted
          # (it was missing fft/image/signal/mcp/data), exactly the manifest-
          # drift failure mode issue #47's guard exists for.
          # Multi-pass until convergence: a package whose jsr: imports aren't
          # on JSR yet fails its pass and succeeds on a later one once its
          # dependencies land (the alphabetical glob is NOT dependency-
          # ordered -- tensor-autograd sorts before tensor-core; found on
          # the first real publish run, 2026-08-14). Three passes covers the
          # family's dependency depth with room to spare.
          for pass in 1 2 3; do
            echo "== JSR publish pass $pass =="
            failures=0
            for f in packages/*/jsr.json adapters/*/jsr.json scalars/*/jsr.json; do
              dir=$(dirname "$f")
              echo "::group::jsr publish — $dir (pass $pass)"
              (cd "$dir" && npx --yes jsr publish --allow-slow-types --allow-dirty) || failures=$((failures+1))
              echo "::endgroup::"
            done
            if [ "$failures" -eq 0 ]; then break; fi
            echo "::warning title=JSR pass $pass::$failures package(s) not published this pass (already-published versions also count here on re-runs)"
          done
